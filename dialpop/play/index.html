<title>Dial Pop: Make 10 Puzzle</title>
<script>
// Dial Pop web: phones and tablets go straight to the game; a desktop browser gets the game in a
// phone-shaped frame so it lays out exactly like on a phone. (build.py --web puts the head above this.)
(function () {
  var desk = matchMedia('(min-width: 760px) and (min-aspect-ratio: 3/4)').matches && matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (!desk) location.replace('game.html' + location.search + location.hash);
})();
</script>
<link rel="stylesheet" href="fonts.css">
<style>
:root { --bg: #10163a; --glow: #26307a; --fg: #e9ecfb; --faint: #8d97c4; --brass: #ffc23d; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(1200px 800px at 50% 40%, var(--glow), var(--bg) 70%) fixed, var(--bg);
  color: var(--fg); font-family: Lexend, "Noto Sans KR", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 48px; overflow: hidden;
}
.dev {
  height: min(calc(100vh - 48px), 940px); aspect-ratio: 9 / 19.5; border-radius: 34px; overflow: hidden;
  background: #151c48; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 0 0 10px #0b1030, 0 0 0 11px rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.55);
}
.dev iframe { width: 100%; height: 100%; border: 0; display: block; }
.side { width: 240px; display: flex; flex-direction: column; gap: 14px; }
.side h1 { margin: 0; font-weight: 800; font-size: 30px; letter-spacing: .01em; }
.side h1 b { color: var(--brass); }
.side p { margin: 0; color: var(--faint); font-size: 14px; line-height: 1.6; }
.side .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font-size: 13px; color: var(--faint); margin-top: 6px; }
.side .keys span:nth-child(odd) { color: var(--fg); font-weight: 600; }
.side a { color: var(--fg); font-size: 13px; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.25); align-self: flex-start; }
.side a:hover { border-color: var(--brass); }
@media (max-width: 900px) { .side { display: none; } }
</style>
<div class="dev"><iframe src="game.html" title="Dial Pop" allow="autoplay; fullscreen; web-share; clipboard-write; identity-credentials-get"></iframe></div>
<div class="side">
  <h1>Dial <b>Pop</b></h1>
  <p>Turn the rings. Make 10 along a line. Pop!</p>
  <div class="keys"><span>Drag</span><span>turn a ring</span><span>10</span><span>pops the line</span></div>
  <p>Best on a phone: open this page there and add it to your home screen.</p>
  <a href="../">About Dial Pop</a>
</div>
