:root{
  --bg:#2b3763; --panel:#2b3c75; --panel-2:#2e4080; --line:rgba(255,255,255,.14); --fg:#ffffff; --muted:#b9c4e6; --faint:#93a1cf;
  --brass:#ffc23d; --brass-ink:#3a2500; --alarm:#ff5a4a;
  --f-title:"Lexend","Noto Sans KR",system-ui,sans-serif; --f-num:"Lexend","Noto Sans KR",system-ui,sans-serif; --f-body:"Lexend","Noto Sans KR",system-ui,sans-serif;   
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;margin:0}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(110% 70% at 50% 42%,rgba(255,255,255,.05) 0%,transparent 70%)}
body{background:var(--bg);transition:background-color 2.5s ease;color:var(--fg);font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));box-sizing:border-box}   
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:clamp(10px,20vh - 40px,150px);box-sizing:border-box;position:relative}   


.hud{width:var(--S);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.hud .pause{position:absolute;right:0;top:0}
.score{position:relative;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;transition:color .35s}
.score strong{font-family:var(--f-title);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.score.gold{color:var(--brass)}
.score.gold strong{text-shadow:0 2px 14px rgba(255,194,61,.35),0 3px 0 rgba(0,0,0,.18)}
.score .shine{position:absolute;font-family:var(--f-title);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,250,225,.95) 48%,transparent 66%);background-size:250% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-title);font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:20px;white-space:nowrap}
.meta .best{display:inline-flex;align-items:center;gap:5px}
.meta .best svg{width:16px;height:12px;color:var(--brass)}
.meta .best b{color:var(--brass);font-weight:600}
.meta .lead{color:var(--brass);font-weight:600}
#lvlV{display:inline-block;transform-origin:center}
#lvlV.up{animation:lvlUp 1.1s ease-out}
@keyframes lvlUp{0%{transform:scale(1)}20%{transform:scale(1.45);color:#fff}100%{transform:scale(1);color:var(--muted)}}
.lives{display:flex;gap:4px}

.streakRow{position:relative;height:30px;display:flex;align-items:center;justify-content:center}

.callout{position:absolute;inset:0;pointer-events:none;z-index:3;container-type:inline-size;overflow:visible}

.pops .pn{position:absolute;white-space:nowrap;font-family:Lexend,var(--f-body);font-weight:900;font-style:italic;line-height:1}

.bc .dome{position:absolute;left:3px;right:3px;top:2px;bottom:7px;border-radius:11px 11px 3px 3px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.3)}

.bc.on.spin .dome::after{opacity:1;animation:bspin 1.1s linear infinite}

.alarm.hot{background:rgba(255,90,74,.14)}

.fuse i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:5px;background:linear-gradient(90deg,#c98e1c,#ffd25a);box-shadow:0 0 12px rgba(255,200,80,.55)}
.fuse i::before{content:"";position:absolute;inset:0;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%)}
.fuse i::after{content:"";position:absolute;right:-13px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;
  background:radial-gradient(circle,#fff 0 18%,#ffe08a 32%,rgba(255,150,40,.7) 48%,rgba(255,120,30,0) 70%);animation:ember .14s infinite alternate}
.fuse.burn i{animation:burn 10s linear forwards}
.fuse.burn.late i{background:linear-gradient(90deg,#c0391b,#ff6a2b);box-shadow:0 0 16px rgba(255,90,40,.7)}
.fuse.burn.late i::after{background:radial-gradient(circle,#fff 0 18%,#ffb27a 32%,rgba(255,80,30,.75) 48%,rgba(255,60,20,0) 70%)}
.sparks{position:absolute;top:50%;width:0;height:0;pointer-events:none}
.sparks b{position:absolute;left:0;top:0;width:3px;height:3px;border-radius:50%;background:#ffe08a;box-shadow:0 0 4px #ffb24a;animation:spark .5s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y));opacity:0}}
#over:not([hidden]) #reviveBtn:not([hidden]){animation:want2 1.4s ease-in-out infinite}
#reviveBtn{min-height:60px;font-size:19px}
#reviveBtn.late{animation:none;background:#ffb02e}
#reviveBtn.beat{animation:beat .38s cubic-bezier(.2,1.6,.4,1)}
#reviveBtn.beat #reviveGain{animation:gainBeat .38s ease-out}
@keyframes gainBeat{30%{transform:scale(1.18)}}
#reviveBtn.gone{animation:gone .45s ease-in forwards}
@keyframes gone{40%{transform:scale(1.04)}100%{transform:scale(.6);opacity:0}}
@keyframes want2{50%{transform:scale(1.025);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 26px rgba(255,194,61,.35)}}
@keyframes beat{0%{transform:scale(1)}30%{transform:scale(1.07)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){#reviveBtn,#reviveBtn.beat,.sparks b{animation:none!important}}
@keyframes burn{from{width:100%}to{width:0%}}
@keyframes ember{from{transform:scale(.8);opacity:.8}to{transform:scale(1.2);opacity:1}}

.menu{display:flex;flex-direction:column;gap:10px;width:min(260px,80%)}
.menu button{width:100%}
.menu button.warn{background:rgba(255,90,74,.12);color:#ff9c90;box-shadow:inset 0 0 0 1px rgba(255,90,74,.4)}

.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateY(6px);font-family:var(--f-title);font-weight:600;font-size:18px;letter-spacing:-.01em;

.loot svg{display:block;width:100%;height:100%}

@keyframes march{to{background-position:14px 0}}
.lgauge .loot.reach svg{filter:none;opacity:1}
