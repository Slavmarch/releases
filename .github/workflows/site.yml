# 사이트 다시 만들기 (2026-10-31 현우 '넣자'): 새 판 목록(family/apps.json)이나 사이트 재료가 바뀌면
# tools/make_site_pages.py 를 돌려 첫 화면·앱 쪽·변경점·내려받기(한국어 + en/)를 다시 만들고 올림.
# Actions 가 올린 커밋은 이 작업을 다시 부르지 않음 (GITHUB_TOKEN) → 되풀이 없음.
name: site
on:
  push:
    branches: [main]
    paths: [family/apps.json, tools/make_site_pages.py, assets/**]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/make_site_pages.py .
      - name: 바뀐 게 있으면 올리기
        run: |
          git add -A index.html apps download notes en
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Site: rebuild pages from family/apps.json"
          git push
